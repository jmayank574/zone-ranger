[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zone-ranger"
version = "0.1.0"
description = "Autonomous fleet marketplace optimizer on NYC HVFHV data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "ortools>=9.10",
    "fastapi>=0.111",
    "pydantic>=2.7",
    "prometheus-client>=0.20",
    "joblib>=1.4",
    "pyshp>=2.3",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
zone-ranger-download = "zone_ranger.download:main"
zone-ranger-eda = "zone_ranger.eda:main"
zone-ranger-features = "zone_ranger.features:main"
zone-ranger-train = "zone_ranger.train:main"
zone-ranger-replay = "zone_ranger.stubs:replay"
zone-ranger-experiment = "zone_ranger.stubs:experiment"

[tool.hatch.build.targets.wheel]
packages = ["src/zone_ranger"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/zone_ranger/eda.py" = ["E501"]  # long SQL strings

[tool.coverage.run]
omit = ["src/zone_ranger/stubs.py"]
