[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetopt"
version = "0.1.0"
description = "Autonomous fleet marketplace optimizer on NYC HVFHV data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "ortools>=9.10",
    "fastapi>=0.111",
    "pydantic>=2.7",
    "prometheus-client>=0.20",
    "joblib>=1.4",
    "pyshp>=2.3",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
fleetopt-download = "fleetopt.download:main"
fleetopt-eda = "fleetopt.eda:main"
fleetopt-features = "fleetopt.features:main"
fleetopt-train = "fleetopt.stubs:train"
fleetopt-replay = "fleetopt.stubs:replay"
fleetopt-experiment = "fleetopt.stubs:experiment"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetopt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/fleetopt/eda.py" = ["E501"]  # long SQL strings

[tool.coverage.run]
omit = ["src/fleetopt/stubs.py"]
